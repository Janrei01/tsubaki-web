<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLERY | 椿、思うは花潜り</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/top.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">TSUBAKI</a>
      <nav class="nav">
        <ul>
          <li><a href="index.html#about">ABOUT</a></li>
          <li><a href="index.html#characters">CHARACTERS</a></li>
          <li><a href="gallery.html">GALLERY</a></li>
          <li><a href="index.html#contact">CONTACT</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section section-quote">
    <div class="container">
      <h1 class="section-title fade-in">GALLERY</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="gallery-grid">
        <div class="gallery-card fade-in">
          <div class="gallery-thumb" data-full="assets/images/15.jpg">
            <img src="assets/images/15.jpg" alt="イラスト 15">
          </div>
          <p class="gallery-caption">ILLUSTRATION 15</p>
        </div>
        <div class="gallery-card fade-in">
          <div class="gallery-thumb" data-full="assets/images/cassette_sanctuary.png">
            <img src="assets/images/cassette_sanctuary.png" alt="cassette_sanctuary">
          </div>
          <p class="gallery-caption">Cassette_sanctuary</p>
        </div>
        <div class="gallery-card fade-in">
          <div class="gallery-thumb" data-full="assets/images/K_defolt.png">
            <img src="assets/images/K_defolt.png" alt="切原 八生">
          </div>
          <p class="gallery-caption">YAO</p>
        </div>
        <div class="gallery-card fade-in">
          <div class="gallery-thumb" data-full="assets/images/M_defolt.png">
            <img src="assets/images/M_defolt.png" alt="潜 成入">
          </div>
          <p class="gallery-caption">MOGURI</p>
        </div>
        <div class="gallery-card fade-in">
          <div class="gallery-thumb" data-full="assets/images/M_icon.png">
            <img src="assets/images/M_icon.png" alt="潜 成入 アイコン">
          </div>
          <p class="gallery-caption">MOGURI ICON</p>
        </div>
        <div class="gallery-card fade-in">
          <div class="gallery-thumb" data-full="assets/images/K_icon.png">
            <img src="assets/images/K_icon.png" alt="切原 八生 アイコン">
          </div>
          <p class="gallery-caption">YAO ICON</p>
        </div>
      </div>
    </div>
  </section>

  <!-- モーダル -->
  <div class="modal" id="galleryModal">
    <button class="modal-close" aria-label="閉じる">×</button>
    <img src="" alt="" class="modal-image" id="modalImage">
  </div>

  <div class="text-center mt-3 mb-3">
    <a href="index.html" class="btn">TOPへ戻る</a>
  </div>

  <footer class="footer">
    <div class="container">
      <p class="footer-note">このサイトはフィクションです。実在の人物・団体・事件とは一切関係ありません。</p>
      <p>&copy; 2026 yakko</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
